# CampusCore static SPA server.
# Serves the Vite build output only: no application code or secrets live here.

server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the server version.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # Content-hashed build assets can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The shell must always be revalidated so a new deploy is picked up.
    location = /index.html {
        expires -1;
    }

    # Client-side routing: deep links such as /admin/students resolve to the
    # application shell instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}