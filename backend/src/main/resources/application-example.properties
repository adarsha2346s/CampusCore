# Copy this file to application.properties and fill in local-only values.
spring.application.name=campuscore
spring.datasource.url=jdbc:mysql://localhost:3306/campuscore
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validate an existing schema; do not create or update database tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Replace with a private random value of at least 32 bytes. Never commit it.
jwt.secret=REPLACE_WITH_A_RANDOM_SECRET_OF_AT_LEAST_32_BYTES
jwt.expiration=86400000
