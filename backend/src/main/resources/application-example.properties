# Copy this file to application.properties and fill in local-only values.
spring.application.name=campuscore
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campuscore}
spring.datasource.username=${DB_USERNAME:campuscore}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validate an existing schema; do not create or update database tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Replace with a private random value of at least 32 bytes. Never commit it.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
