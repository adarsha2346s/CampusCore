# Test-only properties for the authentication end-to-end test.
# Values are throwaway and never used outside the test JVM.
jwt.secret=phase2-e2e-signing-secret-value-32bytes!!
jwt.expiration=86400000
app.cors.allowed-origins=http://localhost:5173

# This test deliberately runs without a database: only the authentication and
# authorization path is real. Persistence auto-configuration is switched off so
# the context does not require a datasource.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.sql.init.autoconfigure.SqlInitializationAutoConfiguration
