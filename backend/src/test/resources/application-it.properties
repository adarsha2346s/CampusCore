# Opt-in integration profile, used only by *IT tests when a datasource is
# supplied via -Dcc.it.datasource.url. Not a production configuration.
# ddl-auto stays "validate": this profile never creates or alters schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
jwt.secret=integration-test-signing-secret-value-32b!!
jwt.expiration=86400000
app.cors.allowed-origins=http://localhost:5173
